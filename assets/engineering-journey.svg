<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">The engineering loop behind my GitHub contributions</title>
  <desc id="desc">A retro terminal-inspired four-stage diagram showing how I detect, build, verify and ship software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b19"/><stop offset="1" stop-color="#090e0d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d5a94b"/><stop offset=".5" stop-color="#e87950"/><stop offset="1" stop-color="#a7d46f"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="390" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="388" rx="17" fill="none" stroke="#31443a"/>
  <path d="M20 54H1180" stroke="#263a31"/>
  <circle cx="34" cy="28" r="5" fill="#e87950"/><circle cx="54" cy="28" r="5" fill="#d5a94b"/><circle cx="74" cy="28" r="5" fill="#a7d46f"/>
  <text x="100" y="33" fill="#8ba394" font-family="monospace" font-size="14" letter-spacing="2">PSTACKS / ENGINEERING LOG</text>
  <text x="42" y="100" fill="#f3d78a" font-family="monospace" font-size="27" font-weight="700">THE WORK BEHIND THE SQUARES</text>
  <text x="43" y="128" fill="#91a99a" font-family="monospace" font-size="15">A recurring pattern in my recent open-source work: turn source code into reliable software.</text>
  <g font-family="monospace">
    <rect x="42" y="165" width="250" height="155" rx="10" fill="#14221d" stroke="#a7d46f" stroke-opacity=".7"/>
    <rect x="326" y="165" width="250" height="155" rx="10" fill="#211d16" stroke="#d5a94b" stroke-opacity=".8"/>
    <rect x="610" y="165" width="250" height="155" rx="10" fill="#211a18" stroke="#e87950" stroke-opacity=".8"/>
    <rect x="894" y="165" width="264" height="155" rx="10" fill="#17221b" stroke="#a7d46f" stroke-opacity=".8"/>
    <g fill="#a7d46f" font-size="13" letter-spacing="2"><text x="62" y="193">01 / DISCOVER</text></g>
    <g fill="#d5a94b" font-size="13" letter-spacing="2"><text x="346" y="193">02 / BUILD</text></g>
    <g fill="#e87950" font-size="13" letter-spacing="2"><text x="630" y="193">03 / VERIFY</text></g>
    <g fill="#a7d46f" font-size="13" letter-spacing="2"><text x="914" y="193">04 / SHIP</text></g>
    <g fill="#f0f2df" font-size="20" font-weight="700">
      <text x="62" y="230">Understand</text><text x="346" y="230">Create</text><text x="630" y="230">Make it hold</text><text x="914" y="230">Deliver</text>
    </g>
    <g fill="#9eb2a5" font-size="13">
      <text x="62" y="258">Languages · frameworks</text><text x="62" y="278">Monorepos · build systems</text>
      <text x="346" y="258">Workers · OCI images</text><text x="346" y="278">Artifacts · pipelines</text>
      <text x="630" y="258">Tests · retries · leases</text><text x="630" y="278">Validation · safe recovery</text>
      <text x="914" y="258">Provider adapters</text><text x="914" y="278">Automated deployments</text>
    </g>
    <g stroke="url(#edge)" stroke-width="2.5" fill="none" filter="url(#glow)">
      <path d="M296 243H318l-7-6m7 6-7 6"/><path d="M580 243H602l-7-6m7 6-7 6"/><path d="M864 243H886l-7-6m7 6-7 6"/>
    </g>
  </g>
  <path d="M42 345H1158" stroke="#263a31"/>
  <text x="43" y="370" fill="#718b7b" font-family="monospace" font-size="12">LESS NOISE. MORE SYSTEMS THAT WORK.</text>
  <text x="1157" y="370" text-anchor="end" fill="#a7d46f" font-family="monospace" font-size="12">PSTACKS-DEV</text>
</svg>